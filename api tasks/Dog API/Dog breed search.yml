info:
  name: Dog breed search
  type: http
  seq: 2

http:
  method: GET
  url: "{{dog_api}}/breeds/search?q=German Shepherd"
  params:
    - name: q
      value: German Shepherd
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
